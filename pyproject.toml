[project]
name = "endtoendmlproject"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "ipykernel>=7.4.0",
    "kafka-python==3.0.11",
    "mlflow>=3,<4",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "prometheus-client>=0.21,<1",
    "pyspark>=4.0,<5",
    "redis==8.1.0",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3",
    "uvicorn[standard]>=0.34,<1",
    "boto3>=1.35,<2",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.10,<4"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
prepare-recommender-data = "src.data.prepare:main"
popularity-baseline = "src.models.popularity:main"
prepare-tower-data = "src.models.prepare_tower_data:main"
train-two-tower = "src.models.train_two_tower:main"
evaluate-two-tower = "src.models.evaluate_two_tower:main"
train-implicit-als = "src.models.collaborative_filtering:main"
prepare-comparison-cohort = "src.models.prepare_comparison_cohort:main"
summarize-recommender-comparison = "src.models.summarize_comparison:main"
demo-two-tower = "src.models.demo_two_tower:main"
run-recommender-batch = "src.pipeline.batch_job:main"
recommender-event-produce = "src.events.produce_event:main"
recommender-event-consume = "src.events.consume_events:main"
register-two-tower-model = "src.models.register_model:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "-ra"
