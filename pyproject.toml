[project]
name = "endtoendmlproject"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "ipykernel>=7.4.0",
    "kafka-python==3.0.11",
    "mlflow>=3,<4",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "prometheus-client>=0.21,<1",
    "pyspark>=4.0,<5",
    "redis==8.1.0",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3",
    "uvicorn[standard]>=0.34,<1",
    "xgboost>=2.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
prepare-recommender-data = "src.data.prepare:main"
popularity-baseline = "src.models.popularity:main"
prepare-tower-data = "src.models.prepare_tower_data:main"
train-two-tower = "src.models.train_two_tower:main"
evaluate-two-tower = "src.models.evaluate_two_tower:main"
train-implicit-als = "src.models.collaborative_filtering:main"
demo-two-tower = "src.models.demo_two_tower:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "-ra"
